name: MERN CI

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --version

      - run: docker --version

      - run: ls

      - run: npm ci
        working-directory: ./backend

      - run: npm ci
        working-directory: ./frontend

      - run: npm test
        working-directory: ./backend

      - run: npm test -- --watchAll=false
        working-directory: ./frontend

      - run: npm run build
        working-directory: ./frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810456132473:role/GitHubActions-Deploy-Role
          aws-region: us-east-1

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker build -t sykes9/mern-backend:${{ github.sha }} -f ./backend/Dockerfile.prod ./backend

      - run: docker build -t sykes9/mern-frontend:${{ github.sha }} -f ./frontend/Dockerfile.prod ./frontend

      - run: docker push sykes9/mern-backend:${{ github.sha }}

      - run: docker push sykes9/mern-frontend:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-060a68e4dba065f5a \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd ~/mern-production",
              "export IMAGE_TAG=${{ github.sha }}",
              "export JWT_SECRET=$(aws ssm get-parameter --name /mern-production/JWT_SECRET --with-decryption --query Parameter.Value --output text)",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "docker compose -f docker-compose.prod.yml ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-060a68e4dba065f5a

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-060a68e4dba065f5a \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-060a68e4dba065f5a \
            --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi
