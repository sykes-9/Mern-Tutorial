- name: Deploy to EC2 via SSM
  shell: bash
  run: |
    set -e

    COMMAND_ID=$(aws ssm send-command \
      --instance-ids i-060a68e4dba065f5a \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "sudo -u ec2-user bash -c '\''set -e; cd /home/ec2-user/mern-production; export IMAGE_TAG=${{ github.sha }}; export JWT_SECRET=$(aws ssm get-parameter --name /mern-production/JWT_SECRET --with-decryption --query Parameter.Value --output text); curl -fsSL https://raw.githubusercontent.com/sykes-9/Mern-Tutorial/main/docker-compose.prod.yml -o docker-compose.prod.yml; docker compose -f docker-compose.prod.yml pull; docker compose -f docker-compose.prod.yml up -d; docker compose -f docker-compose.prod.yml ps'\''"
      ]' \
      --query "Command.CommandId" \
      --output text)

    echo "SSM Command ID: $COMMAND_ID"

    aws ssm wait command-executed \
      --command-id "$COMMAND_ID" \
      --instance-id i-060a68e4dba065f5a

    STATUS=$(aws ssm get-command-invocation \
      --command-id "$COMMAND_ID" \
      --instance-id i-060a68e4dba065f5a \
      --query "Status" \
      --output text)

    echo "Deployment status: $STATUS"

    aws ssm get-command-invocation \
      --command-id "$COMMAND_ID" \
      --instance-id i-060a68e4dba065f5a \
      --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
      --output json

    if [ "$STATUS" != "Success" ]; then
      echo "Deployment failed."
      exit 1
    fi
