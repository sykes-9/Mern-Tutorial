services:
  frontend:
    image: sykes9/mern-frontend:${IMAGE_TAG}
    container_name: frontend-prod
    restart: always
    ports:
      - "80:80"

  backend:
    image: sykes9/mern-backend:${IMAGE_TAG}
    container_name: backend-prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/goalsetter
      JWT_SECRET: ${JWT_SECRET}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo:
    image: mongo
    container_name: mongo-prod
    restart: always
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: